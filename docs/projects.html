    <script id="theme-bootstrap">
      (() => {
        const storageKey = "aj-shaw-color-theme";
        const root = document.documentElement;
        let savedTheme = null;
        try { savedTheme = window.localStorage.getItem(storageKey); } catch {}
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#142b23" : "#f2eddd");
        window.__ajThemePreference = { storageKey, theme };
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <style id="critical-route-colors">
      :root { --route-panel-top: 72px; color-scheme: light; background: #f2eddd; }
      :root[data-theme="dark"] { color-scheme: dark; background: #142b23; }
      html, body { min-height: 100%; margin: 0; background-color: #f2eddd; }
      html[data-theme="dark"], html[data-theme="dark"] body { color: #f2ead7; background-color: #142b23; }
      .route-curtain { position: fixed; top: var(--route-panel-top); right: 0; bottom: 0; left: 0; z-index: 45; display: grid; place-items: center; visibility: hidden; pointer-events: none; color: #faf6e9; border-top: 3px solid #102e24; background: #193f31; transform: translate3d(0, calc(100% + 30px), 0); transition: transform 360ms cubic-bezier(0.24, 0.82, 0.3, 1); }
      html[data-route-arrival="true"] .route-curtain, html[data-route-loading] .route-curtain, .route-curtain.is-covering, .route-curtain.is-loading, .route-curtain.is-revealing { visibility: visible; }
      html[data-route-arrival="true"] .route-curtain, html[data-route-loading] .route-curtain, .route-curtain.is-covering, .route-curtain.is-loading { pointer-events: auto; transform: translate3d(0, 0, 0); }
      .route-curtain.is-revealing { pointer-events: auto; transform: translate3d(0, calc(100% + 30px), 0); }
      @media (max-width: 520px) { :root { --route-panel-top: calc(64px + env(safe-area-inset-top, 0px)); } }
      @media (prefers-reduced-motion: reduce) { .route-curtain { transform: none !important; transition: opacity 140ms ease; } .route-curtain.is-revealing { opacity: 0; background: #f2eddd; } }
    </style>
    <script>
      (() => {
        try {
          const transitionKey = "aj-shaw-route-transition-v1";
          const startedKey = "aj-shaw-route-transition-started-v1";
          const navigationEntry = window.performance?.getEntriesByType?.("navigation")?.[0];
          const isHistoryVisit = navigationEntry?.type === "back_forward";
          if (isHistoryVisit && window.sessionStorage.getItem(transitionKey) !== "1") {
            window.sessionStorage.setItem(transitionKey, "1");
            window.sessionStorage.setItem(startedKey, String(Date.now()));
            document.documentElement.dataset.routeHistory = "true";
          }
          if (window.sessionStorage.getItem(transitionKey) === "1") {
            document.documentElement.dataset.routeArrival = "true";
            const started = Number(window.sessionStorage.getItem(startedKey));
            if (started) window.setTimeout(() => {
              if (document.documentElement.dataset.routeArrival === "true") document.documentElement.dataset.routeLoading = "";
            }, Math.max(0, 650 - (Date.now() - started)));
          }
        } catch {}
      })();
    </script>

    <script>
      (() => {
        const launch = document.querySelector("#launch-sequence");
        const navigationEntry = window.performance?.getEntriesByType?.("navigation")?.[0];
        const isReload = navigationEntry?.type === "reload";
        const arrivingFromSite = document.documentElement.dataset.routeArrival === "true";
        if (!launch || (arrivingFromSite && !isReload)) return;
        const reveal = () => { document.documentElement.classList.remove("intro-active"); launch.hidden = true; launch.setAttribute("aria-hidden", "true"); window.clearTimeout(window.__ajArchiveIntroSafety); window.removeEventListener("error", reveal); window.removeEventListener("unhandledrejection", reveal); };
        window.__ajSimpleIntroFailSafe = reveal;
        document.documentElement.classList.add("intro-active");
        launch.hidden = false;
        launch.setAttribute("aria-hidden", "false");
        window.addEventListener("error", reveal, { once: true });
        window.addEventListener("unhandledrejection", reveal, { once: true });
        window.__ajArchiveIntroSafety = window.setTimeout(reveal, 3500);
      })();
    </script>
