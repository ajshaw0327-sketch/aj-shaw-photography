  <body data-page="events" data-asset-root="./">
    <header class="site-header">
      <a class="wordmark" href="./" aria-label="AJ Shaw Photography, home">AJ Shaw <span>Photography</span></a>
      <span class="character-sprite character-header" data-character="woodstock" role="button" tabindex="0" aria-label="Play Woodstock animation"></span>

        <span class="nav-marker" aria-hidden="true"><i class="marker-bird"></i></span>
        <a href="./" data-route="home">Home</a><a href="travel.html" data-route="travel">Travel</a><a href="events.html" data-route="events">Events</a><a href="sports.html" data-route="sports">Sports</a><a href="about.html" data-route="about">About</a><a href="contact.html" data-route="contact">Contact</a>

    <main class="page page-portfolio">
      <section class="gallery-section" data-gallery-view="events" aria-labelledby="gallery-title">
        <div class="portfolio-label">
          <h1 id="gallery-title">Events</h1>
        </div>
        <div class="photo-grid" id="photo-grid" aria-live="polite"></div>
        <p class="gallery-status" id="gallery-status">Preparing the contact sheet…</p>

    <footer class="site-footer">
      <p>© 2026 AJ Shaw Photography</p><span class="character-sprite character-footer" data-character="snack" role="button" tabindex="0" aria-label="Play Snoopy snack animation"></span>

    <div class="lightbox" id="lightbox" hidden aria-label="Photo viewer backdrop">
      <button class="lightbox-backdrop" type="button" aria-label="Close photo viewer" tabindex="-1"></button>
      <div class="lightbox-frame" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
        <div class="lightbox-topline"><span><i aria-hidden="true"></i><b id="lightbox-count">Frame 1 / 1</b></span><button type="button" id="lightbox-close">Close ×</button></div>
        <div class="lightbox-image"><img id="lightbox-photo" src="" alt="" /></div>
        <div class="lightbox-caption"><button type="button" id="lightbox-previous" aria-label="View previous photograph">← Previous</button><div><h2 id="lightbox-title"></h2><p id="lightbox-detail"></p></div><button type="button" id="lightbox-next" aria-label="View next photograph">Next →</button></div>
      </div>
    </div>
